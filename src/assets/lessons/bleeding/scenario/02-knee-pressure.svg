<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160">
  <rect width="240" height="160" rx="24" fill="#fef2f2"/>
  <!-- faded residual blood, mostly stopped -->
  <ellipse cx="185" cy="116" rx="40" ry="18" fill="#dc2626" opacity="0.25"/>
  <!-- leg -->
  <rect x="10" y="50" width="135" height="55" rx="24" fill="#64748b" stroke="#1e293b" stroke-width="5"/>
  <!-- wound, mostly covered -->
  <rect x="128" y="54" width="40" height="47" rx="10" fill="#ef4444" stroke="#1e293b" stroke-width="5"/>
  <!-- rescuer's shin -->
  <rect x="138" y="14" width="36" height="70" rx="14" fill="#334155" stroke="#1e293b" stroke-width="5"/>
  <!-- rescuer's knee pressing down on the wound -->
  <circle cx="156" cy="78" r="44" fill="#1e293b" stroke="#0f172a" stroke-width="4"/>
  <!-- downward pressure arrow -->
  <path d="M156 12 v16 m-8 -8 l8 8 l8 -8" fill="none" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
