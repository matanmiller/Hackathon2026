<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160">
  <rect width="240" height="160" rx="24" fill="#fef2f2"/>
  <!-- leg -->
  <rect x="10" y="50" width="135" height="55" rx="24" fill="#64748b" stroke="#1e293b" stroke-width="5"/>
  <!-- wound, bleeding now controlled -->
  <rect x="128" y="54" width="40" height="47" rx="10" fill="#ef4444" stroke="#1e293b" stroke-width="5"/>
  <!-- improvised tourniquet band -->
  <rect x="36" y="42" width="28" height="71" rx="6" fill="#f59e0b" stroke="#1e293b" stroke-width="5"/>
  <!-- stick used to twist the band -->
  <rect x="14" y="73" width="84" height="10" rx="5" fill="#92400e" stroke="#1e293b" stroke-width="4" transform="rotate(-18 56 78)"/>
  <!-- twist motion arrow -->
  <path d="M104 28 a18 18 0 1 1 -10 -14" fill="none" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>
  <path d="M90 10 l4 8 l9 -3Z" fill="#1e293b"/>
</svg>
